# The measurement layer of the workshop. The shops of the baseline and of the candidate are
# images of two git refs, built with scripts/build-shop.sh or pulled from GHCR:
#   scripts/build-shop.sh main pr/lcp-hero-lazy
#   CANDIDATE=pr-lcp-hero-lazy docker compose up -d
#   docker compose run --rm agents
# The lite profile, for machines with 8 GB, runs everything except the local LLM:
#   COMPOSE_PROFILES=lite docker compose up -d
# Every service runs on the lab network, which has no access to the internet.
name: agent-first-perf-audits

services:
  thirdparty:
    image: ghcr.io/nucliweb/agent-first-perf-audits/thirdparty:main
    build:
      context: apps/thirdparty
      dockerfile: ../../docker/thirdparty/Dockerfile
    networks: [lab]

  shop-baseline:
    image: ghcr.io/nucliweb/agent-first-perf-audits/shop:${BASELINE:-main}
    environment:
      THIRDPARTY_ORIGIN: http://thirdparty:4000
    depends_on:
      thirdparty:
        condition: service_healthy
    networks: [lab]

  shop-candidate:
    image: ghcr.io/nucliweb/agent-first-perf-audits/shop:${CANDIDATE:-pr-noop-refactor}
    environment:
      THIRDPARTY_ORIGIN: http://thirdparty:4000
    depends_on:
      thirdparty:
        condition: service_healthy
    networks: [lab]

  # The local LLM of the Judge, with the model inside the image. The .env of the repo turns on
  # the llm profile; with COMPOSE_PROFILES=lite there is no ollama to pull or start
  ollama:
    image: ghcr.io/nucliweb/agent-first-perf-audits/ollama:llama3.2-3b
    profiles: [llm]
    build:
      context: docker/ollama
    networks: [lab]

  agents:
    image: ghcr.io/nucliweb/agent-first-perf-audits/agents:main
    # Only with docker compose run: up starts the lab, not a Chromium that would share the CPU
    # with a measurement
    profiles: [run]
    build:
      context: .
      dockerfile: docker/agents/Dockerfile
    environment:
      BASELINE_URL: http://shop-baseline:3000
      CANDIDATE_URL: http://shop-candidate:3000
      THIRDPARTY_URL: http://thirdparty:4000
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:3b
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    depends_on:
      shop-baseline:
        condition: service_healthy
      shop-candidate:
        condition: service_healthy
      ollama:
        condition: service_healthy
        required: false
    networks: [lab]

  # The performance gate of a pull request: it measures CANDIDATE against BASELINE, explains the
  # verdict and writes the reports to out/. It exits with 0 on pass and 1 on fail:
  #   CANDIDATE=pr-lcp-hero-lazy docker compose run --rm ci
  ci:
    extends: agents
    command: ["node", "src/ci/gate.ts"]
    environment:
      # The shop images under comparison; ci finds their branches in the repo
      BASELINE: ${BASELINE:-main}
      CANDIDATE: ${CANDIDATE:-pr-noop-refactor}
      REPO: /repo
      OUT: /out
    volumes:
      - .:/repo:ro
      - ./out:/out

networks:
  lab:
    internal: true
