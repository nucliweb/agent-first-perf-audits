<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" role="img" aria-labelledby="t d">
  <title id="t">The flow of the subagents</title>
  <desc id="d">The navigator walks the journeys of the shop and hands them to cls and loaf, which measure them; lcp measures the load of the home on its own. Each subagent runs on shop-baseline and on shop-candidate and writes a JSON per side in out/agents. The judge runs the gate, applies the rules, asks the LLM for the explanation and adds the findings of the subagents to its report.</desc>
  <style>
    .bg { fill: #f6f8f6; }
    .box { fill: #ffffff; stroke: #2f3b33; stroke-width: 2; }
    .name { font: 600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #17201a; text-anchor: middle; }
    .note { font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4f5e54; text-anchor: middle; }
    .label { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5b6a60; }
    .line { fill: none; stroke: #2f3b33; stroke-width: 2; }
    .head { fill: #2f3b33; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #131915; }
      .box { fill: #1b231e; stroke: #c9d5cc; }
      .name { fill: #eef3ef; }
      .note { fill: #aab8ae; }
      .label { fill: #9aa89f; }
      .line { stroke: #c9d5cc; }
      .head { fill: #c9d5cc; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z" />
    </marker>
  </defs>

  <rect class="bg" width="1120" height="380" rx="16" />
  <text class="label" x="24" y="38">measure</text>
  <text class="label" x="670" y="138">decide and explain</text>

  <rect class="box" x="24" y="60" width="200" height="64" rx="10" />
  <text class="name" x="124" y="88">navigator</text>
  <text class="note" x="124" y="110">open_page, interact</text>

  <text class="label" x="242" y="82">journeys</text>
  <path class="line" d="M224,92 H330" marker-end="url(#arrow)" />
  <path class="line" d="M124,124 V192 H330" marker-end="url(#arrow)" />

  <rect class="box" x="330" y="60" width="260" height="64" rx="10" />
  <text class="name" x="460" y="88">cls</text>
  <text class="note" x="460" y="110">run_snippet</text>

  <rect class="box" x="330" y="160" width="260" height="64" rx="10" />
  <text class="name" x="460" y="188">loaf</text>
  <text class="note" x="460" y="210">run_workflow, trace of the click</text>

  <rect class="box" x="330" y="260" width="260" height="64" rx="10" />
  <text class="name" x="460" y="288">lcp</text>
  <text class="note" x="460" y="310">run_workflow, trace of the load</text>

  <path class="line" d="M590,92 H630 V180 H670" marker-end="url(#arrow)" />
  <path class="line" d="M590,192 H670" marker-end="url(#arrow)" />
  <path class="line" d="M590,292 H630 V204 H670" marker-end="url(#arrow)" />

  <rect class="box" x="670" y="160" width="190" height="64" rx="10" />
  <text class="name" x="765" y="188">judge</text>
  <text class="note" x="765" y="210">gate, rules, LLM</text>

  <path class="line" d="M860,192 H920" marker-end="url(#arrow)" />

  <rect class="box" x="920" y="160" width="176" height="64" rx="10" />
  <text class="name" x="1008" y="188">report.md</text>
  <text class="note" x="1008" y="210">out/agents/judge/</text>

  <text class="note" x="560" y="358">each subagent runs on shop-baseline and on shop-candidate, and writes out/agents/&lt;name&gt;-&lt;side&gt;.json</text>
</svg>
