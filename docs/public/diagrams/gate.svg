<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 340" role="img" aria-labelledby="t d">
  <title id="t">How the gate decides</title>
  <desc id="d">The gate measures the baseline and the candidate with their runs alternating, 5 a side. A metric regresses when its delta beats its threshold and the Mann-Whitney U test gives p under 0.05: the gate exits with 1, trace-engine-cli attributes the change and the LLM explains it. When the delta beats the threshold and p does not reach 0.05, the metric is inconclusive: the gate measures up to 7 runs a side and decides once more. Otherwise it exits with 0.</desc>
  <style>
    .bg { fill: #f6f8f6; }
    .box { fill: #ffffff; stroke: #2f3b33; stroke-width: 2; }
    .pass { stroke: #15803d; }
    .fail { stroke: #b91c1c; }
    .more { stroke: #b45309; }
    .llm { stroke-dasharray: 6 5; }
    .name { font: 600 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #17201a; text-anchor: middle; }
    .note { font: 15px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #4f5e54; text-anchor: middle; }
    .label { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #5b6a60; }
    .line { fill: none; stroke: #2f3b33; stroke-width: 2; }
    .head { fill: #2f3b33; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #131915; }
      .box { fill: #1b231e; stroke: #c9d5cc; }
      .pass { stroke: #4ade80; }
      .fail { stroke: #f87171; }
      .more { stroke: #fbbf24; }
      .name { fill: #eef3ef; }
      .note { fill: #aab8ae; }
      .label { fill: #9aa89f; }
      .line { stroke: #c9d5cc; }
      .head { fill: #c9d5cc; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z" />
    </marker>
  </defs>

  <rect class="bg" width="1120" height="340" rx="16" />
  <text class="label" x="24" y="38">rules</text>
  <text class="label" x="1004" y="216">LLM</text>

  <rect class="box" x="24" y="60" width="300" height="64" rx="10" />
  <text class="name" x="174" y="88">baseline, candidate, ...</text>
  <text class="note" x="174" y="110">5 runs a side, alternating</text>

  <rect class="box" x="354" y="60" width="210" height="64" rx="10" />
  <text class="name" x="459" y="88">delta &gt; threshold</text>
  <text class="note" x="459" y="110">median</text>

  <rect class="box" x="594" y="60" width="150" height="64" rx="10" />
  <text class="name" x="669" y="88">p &lt; 0.05</text>
  <text class="note" x="669" y="110">Mann-Whitney U</text>

  <rect class="box fail" x="824" y="60" width="110" height="64" rx="10" />
  <text class="name" x="879" y="88">exit 1</text>
  <text class="note" x="879" y="110">fail</text>

  <rect class="box pass" x="384" y="230" width="150" height="64" rx="10" />
  <text class="name" x="459" y="258">exit 0</text>
  <text class="note" x="459" y="280">pass</text>

  <rect class="box more" x="584" y="230" width="170" height="64" rx="10" />
  <text class="name" x="669" y="258">--max-runs 7</text>
  <text class="note" x="669" y="280">inconclusive: once</text>

  <rect class="box" x="784" y="230" width="190" height="64" rx="10" />
  <text class="name" x="879" y="258">trace-engine-cli</text>
  <text class="note" x="879" y="280">function, URL, line</text>

  <rect class="box llm" x="1004" y="230" width="102" height="64" rx="10" />
  <text class="name" x="1055" y="258">explain</text>
  <text class="note" x="1055" y="280">one sentence</text>

  <path class="line" d="M324,92 H346" marker-end="url(#arrow)" />
  <path class="line" d="M564,92 H586" marker-end="url(#arrow)" />
  <path class="line" d="M744,92 H816" marker-end="url(#arrow)" />
  <path class="line" d="M459,124 V222" marker-end="url(#arrow)" />
  <path class="line" d="M669,124 V222" marker-end="url(#arrow)" />
  <path class="line" d="M584,262 H542" marker-end="url(#arrow)" />
  <path class="line" d="M754,250 H770 V92" />
  <path class="line" d="M879,124 V222" marker-end="url(#arrow)" />
  <path class="line" d="M974,262 H996" marker-end="url(#arrow)" />

  <text class="label" x="469" y="150">no</text>
  <text class="label" x="679" y="150">no</text>
  <text class="label" x="548" y="252">no</text>
  <text class="label" x="778" y="180">yes</text>
  <text class="label" x="889" y="150">attribute</text>
</svg>
